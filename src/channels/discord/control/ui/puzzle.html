<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your puzzle</title>
<style>
  :root {
    --ground: #15120f;
    --panel: #221d19;
    --line: #38302a;
    --ink: #f3ece2;
    --dim: #a89b8d;
    --light: #e9dab9;
    --dark: #9c7a5b;
    --moved: #f4d35e;
    --pick: #6fbf73;
    --check: #e2564a;
    --accent: #9b59b6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body { padding: 14px 14px calc(22px + env(safe-area-inset-bottom)); }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0; letter-spacing: .01em; }
  .head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 4px 10px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .grade { color: var(--dim); font-size: 12.5px; min-width: 0; overflow-wrap: anywhere; }
  .seat {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 11px; margin: 6px 0;
  }
  .seat.turn { border-color: var(--accent); box-shadow: inset 0 0 0 1px rgba(155,89,182,.35); }
  .chip { font-size: 12px; color: var(--dim); white-space: nowrap; flex: 0 0 auto; }
  .steps { font-variant-numeric: tabular-nums; font-weight: 700; }

  .board {
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    width: 100%; aspect-ratio: 1; margin: 10px 0;
    border: 6px solid #3e3026; border-radius: 10px; overflow: hidden;
    touch-action: manipulation;
  }
  .sq {
    position: relative; border: 0; padding: 0; margin: 0; min-width: 0; min-height: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: min(8.6vw, 48px); line-height: 1; cursor: pointer;
    background: var(--dark); color: inherit; -webkit-tap-highlight-color: transparent;
  }
  .sq.lightsq { background: var(--light); }
  .sq.moved::before, .sq.check::before { content: ""; position: absolute; inset: 0; }
  .sq.moved::before { background: rgba(244, 211, 94, .55); }
  .sq.check::before { background: rgba(226, 86, 74, .6); }
  /* A text font, and never the emoji one: iOS has a black-pawn emoji that
     no colour of ours can reach, which turned white pawns black. */
  .sq .p { position: relative; z-index: 1; font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", serif; font-variant-emoji: text; }
  .sq .p.w { color: #faf7f0; text-shadow: 0 0 1px #221, 0 1px 0 #221, 1px 0 0 #221, -1px 0 0 #221, 0 -1px 0 #221; }
  .sq .p.b { color: #241f1a; text-shadow: 0 0 1px #eee, 0 1px 0 #ddd8cc, -1px 0 0 #ddd8cc, 1px 0 0 #ddd8cc; }
  .sq .dot { position: absolute; z-index: 2; width: 26%; height: 26%; border-radius: 50%; background: rgba(31, 92, 40, .5); }
  .sq.takeable .dot { width: 84%; height: 84%; background: none; border: 5px solid rgba(31, 92, 40, .5); }
  .sq.picked::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px var(--pick); }
  .sq .co { position: absolute; font-size: 9px; font-weight: 700; opacity: .8; z-index: 2; color: var(--light); }
  .sq.lightsq .co { color: var(--dark); }
  .sq .co.f { right: 3px; bottom: 1px; }
  .sq .co.r { left: 3px; top: 1px; }

  .note { min-height: 20px; margin: 4px 2px 10px; font-size: 13.5px; color: var(--dim); }
  .note.bad { color: #ffb4a8; }
  .note.good { color: #9fe0a4; }
  .moves {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim); max-height: 132px; overflow-y: auto; overflow-wrap: anywhere;
  }
  .promo {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 10px;
    padding: 9px 11px; margin-top: 10px;
  }
  .promo button {
    font-size: 26px; line-height: 1; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: #2d2721; color: #faf7f0; cursor: pointer;
  }
  .foot { color: var(--dim); font-size: 12px; margin-top: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="head">
    <h1 id="title">Your puzzle</h1>
    <div class="grade" id="grade"></div>
  </div>

  <div class="seat" id="seat-them">
    <span class="who">They have just played <b id="setup">…</b></span>
    <span class="chip" id="them-side"></span>
  </div>

  <div class="board" id="board" aria-label="chess board"></div>

  <div class="seat turn" id="seat-me">
    <span class="who"><b id="me-side">Your move</b></span>
    <span class="chip"><span class="steps" id="steps"></span></span>
  </div>

  <p class="note" id="note">Loading your puzzle…</p>

  <div class="promo" id="promo" hidden>
    <span>Promote to</span>
    <button type="button" data-piece="q">&#9819;&#xFE0E;</button>
    <button type="button" data-piece="r">&#9820;&#xFE0E;</button>
    <button type="button" data-piece="b">&#9821;&#xFE0E;</button>
    <button type="button" data-piece="n">&#9822;&#xFE0E;</button>
    <button type="button" data-piece="x" style="font-size:15px;padding:12px 10px">Cancel</button>
  </div>

  <div class="moves" id="moves">Nothing played yet.</div>

  <p class="foot">This link is yours alone and stops working when the puzzle is replaced. A chess engine would find this in a blink — the point is to find it yourself.</p>
</main>
<script src="/assets/puzzle.js"></script>
</body>
</html>
