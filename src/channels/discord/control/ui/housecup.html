<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<title>House Cup · MLCI</title>
<link rel="stylesheet" href="/assets/housecup.css">
<script src="/assets/housecup.js" defer></script>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="title">
      <h1>🏆 House Cup</h1>
      <p class="period" id="period">Loading the scoreboard…</p>
    </div>
    <div class="corner">
      <p class="live" id="live"><span class="dot" id="dot" aria-hidden="true"></span><span id="freshness">connecting…</span></p>
      <button type="button" class="switch" id="theme" aria-label="Switch between light and dark">🌙</button>
    </div>
  </header>

  <p class="trouble" id="trouble" hidden></p>

  <section class="standings" id="standings" aria-label="Standings"></section>

  <section class="houses" id="houses" aria-label="Each house"></section>

  <footer class="foot">
    <p>Points reset at midnight on the 1st, India time. Chocolate Frog cards count for whichever house their holder is in now.</p>
    <p class="thin">This page updates itself · no sign-in · display names only</p>
  </footer>

  <noscript><p class="trouble">This page needs JavaScript to draw the scoreboard. In Discord, <b>/housetop</b> shows a house's top ten and <b>/frogs</b> shows your cards.</p></noscript>
</main>

<!-- What a click on a name opens: that member's own Chocolate Frog cards. A
     drawer on a wide screen, a sheet up from the bottom on a phone. It is filled
     in from the same state as the rest of the page, so it keeps up with the
     ten-second refresh instead of going stale or closing under the reader. -->
<div class="veil" id="veil" hidden>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name" tabindex="-1">
    <header class="sheet-top">
      <span class="crest" id="sheet-crest" aria-hidden="true"></span>
      <div class="sheet-who">
        <h2 id="sheet-name"></h2>
        <p class="sheet-sub" id="sheet-sub"></p>
      </div>
      <button type="button" class="shut-x" id="shut" aria-label="Close this member">✕</button>
    </header>
    <div class="sheet-body">
      <p class="sheet-line" id="sheet-line"></p>
      <div class="cards" id="sheet-cards"></div>
      <p class="empty" id="sheet-none" hidden></p>
    </div>
  </aside>
</div>
</body>
</html>
